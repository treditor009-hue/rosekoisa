function id(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadData(){try{return {...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return defaults()}}
function saveData(sync=true){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Your browser storage is getting full. Please remove a very large image/document.')} if(sync&&session) syncCloud()}
async function syncCloud(){if(!session||cloudBusy)return;cloudBusy=true;try{const {error}=await supabase.from('rose_workspaces').upsert({user_id:session.user.id,data:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;lastSave=Date.now();setSync('Saved safely to your account')}catch(e){setSync('Saved on this device · cloud sync issue');console.warn(e)}finally{cloudBusy=false}}
function setSync(t){const el=document.getElementById('sync-text');if(el)el.textContent=t}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3400)}
function fmtDate(v,opts){if(!v)return '';const d=new Date(v.length===10?v+'T12:00:00':v);if(isNaN(d))return v;return d.toLocaleDateString('en-GB',opts||{day:'numeric',month:'short'})}
function fmtTime(v){if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function activeNotes(){return (data.notes||[]).filter(n=>!n.at||new Date(n.at)<=new Date()).sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))}
function dueTasks(){return (data.tasks||[]).filter(t=>!t.done).sort((a,b)=>score(b)-score(a))}
function score(t){const days=Math.max(.25,(new Date((t.due||today())+'T23:59:00')-new Date())/86400000);return ((Number(t.priority)||1)*1.8+(Number(t.minutes)||25)/30)/days}
function stats(){const ts=data.tasks||[],done=ts.filter(t=>t.done).length, todayts=ts.filter(t=>t.due===today()),todaydone=todayts.filter(t=>t.done).length;return {done,total:ts.length,today:todayts.length,todaydone,rate:todayts.length?Math.round(todaydone/todayts.length*100):0,minutes:(data.studySessions||[]).filter(s=>s.day===today()).reduce((a,s)=>a+s.minutes,0)}}
function setTheme(){document.documentElement.style.setProperty('--pink',data.profile.theme||'#c85189');document.documentElement.style.setProperty('--pale',mix(data.profile.theme||'#c85189'));if(data.profile.wallpaper)document.body.style.backgroundImage='linear-gradient(#fff7fbe8,#fff7fbe8),url('+data.profile.wallpaper+')';else document.body.style.backgroundImage='none'}
function mix(hex){try{const c=hex.replace('#','');const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return 'rgb('+Math.round(r+(255-r)*.88)+','+Math.round(g+(255-g)*.88)+','+Math.round(b+(255-b)*.88)+')'}catch{return '#ffe8f2'}}

ass="btnrow"><button class="ghost" data-act="sync-now">Sync now</button><button class="ghost" data-act="signout">Sign out</button></div>':'<p class="muted small">Create a private account or sign in to sync your tasks, calendar, notes and study data across devices.</p><form id="auth-form"><div class="field"><label>Email address</label><input name="email" required type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input name="password" required type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></div><div class="btnrow"><button class="primary" name="mode" value="signin">Sign in</button><button class="ghost" name="mode" value="signup">Create account</button></div></form><div id="auth-msg" class="muted small" style="margin-top:10px">Email confirmation may be required, depending on account settings.</div>')+'<hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Reminders & privacy</h3><p class="muted small">Reminders fire while the app is open. Browser notifications require permission. Local data stays in this browser unless you sign in and sync.</p><div class="btnrow"><button class="soft" data-act="notifications">Enable browser reminders</button><button class="ghost" data-act="sound-toggle">Sound: '+(data.settings.sound?'On':'Off')+'</button></div><div class="sectionhead"><h3>Export or reset</h3></div><div class="btnrow"><button class="ghost" data-act="export-data">Export my data (JSON)</button><button class="ghost danger" data-act="reset-data">Reset this planner</button></div></section></div>'}

async function startVoiceRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Voice recording is not supported by this browser.');return}try{recordedAudio='';recordingChunks=[];recorderStream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(recorderStream);recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordingChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recordingChunks,{type:recorder?.mimeType||'audio/webm'});const reader=new FileReader();reader.onload=()=>{recordedAudio=String(reader.result||'');const preview=document.getElementById('voice-preview');if(preview&&recordedAudio){preview.src=recordedAudio;preview.classList.remove('hidden')}const status=document.getElementById('voice-status');if(status)status.textContent='Voice note ready. It will be saved with your letter.';const stop=document.getElementById('stop-recording');if(stop)stop.classList.add('hidden')};reader.readAsDataURL(blob);if(recorderStream)recorderStream.getTracks().forEach(t=>t.stop());recorderStream=null;recorder=null};recorder.start();const status=document.getElementById('voice-status');if(status)status.textContent='Recording… up to 45 seconds.';const stop=document.getElementById('stop-recording');if(stop)stop.classList.remove('hidden');toast('Recording started. Speak from the heart. 💗');setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},45000)}catch(e){if(recorderStream)recorderStream.getTracks().forEach(t=>t.stop());recorderStream=null;recorder=null;toast('Microphone access was not granted. Allow microphone access and try again.')}}function stopVoiceRecording(){if(recorder&&recorder.state==='recording')recorder.stop()}

function speechRecognitionClass(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function speakVoiceReply(text){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){toast('Spoken replies are not supported by this browser.');return}try{window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(String(text));utterance.lang='en-GB';utterance.rate=.95;utterance.pitch=1.02;window.speechSynthesis.speak(utterance)}catch(e){toast('Could not start spoken reply in this browser.')}}
function startSpeechCapture(target){const SR=speechRecognitionClass();if(!SR){toast('Voice input is not available in this browser. Try the latest Chrome or Edge, or type your message.');return}if(voiceRecognition){try{voiceRecognition.stop()}catch{}voiceRecognition=null}voiceTarget=target;voiceShouldSend=target==='chat';const field=document.getElementById(target==='chat'?'voice-message':'voice-transcript');if(!field){toast('Open Voice companion first.');return}voiceBaseText=target==='note'?field.value.trim():'';const sr=new SR();voiceRecognition=sr;sr.lang='en-GB';sr.continuous=true;sr.interimResults=true;sr.maxAlternatives=1;sr.onresult=event=>{let transcript='';for(let i=0;i<event.results.length;i++)transcript+=event.results[i][0].transcript+(event.results[i].isFinal?' ':'');if(target==='chat'){const input=document.getElementById('voice-message');if(input)input.value=transcript.trim()}else{const input=document.getElementById('voice-transcript');if(input)input.value=(voiceBaseText?voiceBaseText+'\n':'')+transcript.trim();const status=document.getElementById('dictation-status');if(status)status.textContent='Listening and transcribing… edit the text any time.'}};sr.onerror=event=>{voiceShouldSend=false;const status=document.getElementById('dictation-status');if(target==='note'&&status)status.textContent=event.error==='not-allowed'?'Microphone access was blocked. Enable it in your browser settings.':'Voice recognition stopped: '+event.error;toast(event.error==='not-allowed'?'Allow microphone access to use voice input.':'Speech recognition issue: '+event.error)};sr.onend=()=>{const endedTarget=voiceTarget;voiceRecognition=null;const orb=document.getElementById('voice-orb');if(orb)orb.classList.remove('listening');const status=document.getElementById('dictation-status');if(endedTarget==='note'&&status)status.textContent='Transcription paused. You can edit or save the text below.';if(endedTarget==='chat'&&voiceShouldSend){voiceShouldSend=false;const input=document.getElementById('voice-message');const message=input?.value.trim();if(message)sendVoiceMessage(message)}};try{sr.start();const orb=document.getElementById('voice-orb');if(orb)orb.classList.add('listening');const status=document.getElementById('dictation-status');if(target==='note'&&status)status.textContent='Listening… speak naturally, then tap Stop.';toast(target==='chat'?'Listening. Say what you would like help with.':'Dictation started. Speak clearly and naturally.')}catch(e){voiceRecognition=null;voiceShouldSend=false;toast('Could not start the microphone. Check browser permission and try again.')}}
function plannerVoiceAnswer(raw){const m=raw.toLowerCase().trim();const pending=dueTasks();const s=stats();if(/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(m))return 'Hello Rose 🌷 I am right here. What shall we work on together?';if(/how are you/.test(m))return 'I am ready to help, Rose. How you are feeling matters more than how many tasks you finish.';if(/what should i do next|what do i do first|plan my day|help me plan|what is most important/.test(m)){const p=planSuggestion();return p.title+' '+p.detail}if(/how many.*(task|todo)|task count|how much.*left|progress today/.test(m))return 'You have completed '+s.done+' of '+s.total+' tasks overall. Today, '+s.todaydone+' of '+s.today+' tasks due today are complete, and you have logged '+s.minutes+' minutes of focus time.';if(/what.*(calendar|schedule|coming up|classes|deadlines)|when is my next/.test(m)){const events=(data.events||[]).filter(e=>String(e.start||e.date||'')>=today()).sort((a,b)=>new Date(a.start||a.date)-new Date(b.start||b.date)).slice(0,4);return events.length?'Here is what is coming up: '+events.map(e=>(e.title||'Event')+' on '+fmtDate(e.start||e.date)+' at '+fmtTime(e.start||e.date)).join('; '):'Your calendar is clear for now. You can add a class, deadline or reminder in the Calendar section.'}if(/show.*(task|todo)|what.*(task|todo).*(have|left)|my pending work/.test(m)){return pending.length?'Your pending tasks are: '+pending.slice(0,6).map((t,i)=>(i+1)+'. '+t.title+'; due '+fmtDate(t.due)+', '+(t.minutes||25)+' minutes').join('. '):'You have no pending tasks. Take a breath or add a new goal.'}if(/start.*focus|start.*timer|pomodoro/.test(m)){timerSeconds=25*60;timerMode='Focus';page='Focus timer';render();return 'Your 25-minute focus timer is ready. Tap Start focus when you are ready.'}const add=m.match(/^(?:please\s+)?(?:add|create)\s+(?:a\s+)?(?:task|todo|reminder)\s+(?:to\s+)?(.+)$/i)||m.match(/^remind me to\s+(.+)$/i);if(add){const title=add[1].replace(/[.!?]+$/,'').trim();if(title){data.tasks.push({id:id(),title,course:'Voice added',due:today(),priority:2,minutes:25,done:false});saveData();return 'Done, Rose. I added “'+title+'” to your tasks for today. You can change its priority and due date in Planner.'}}if(/take a note|dictate|transcribe/.test(m))return 'Open the Listen and transcribe notes area below. Tap Dictate and start speaking; then save the transcript to Study Library or Rose Mail.';if(/thank you|thanks/.test(m))return 'You are very welcome, Rose. One little step at a time. 💗';return 'I heard you say: “'+raw+'”. I can answer questions about your tasks, help you decide what to do next, check your calendar, add tasks by voice and transcribe notes. For wider open-ended conversations, I need an AI service connected securely using an API key; it is not connected yet.'}
function sendVoiceMessage(raw){const message=String(raw||'').trim();if(!message)return;if(!Array.isArray(data.voiceMessages))data.voiceMessages=[];data.voiceMessages.push({id:id(),role:'user',text:message,at:new Date().toISOString()});const answer=plannerVoiceAnswer(message);data.voiceMessages.push({id:id(),role:'assistant',text:answer,at:new Date().toISOString()});data.voiceMessages=data.voiceMessages.slice(-80);saveData();page='Voice companion';render();const log=document.getElementById('voice-chat-log');if(log)log.scrollTop=log.scrollHeight;if(voiceSpeakReplies)speakVoiceReply(answer)}

function clockSound(){if(!data.settings.sound)return;try{const ctx=new AudioContext(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=660;g.gain.value=.07;o.start();o.stop(ctx.currentTime+.3);setTimeout(()=>ctx.close(),500)}catch{}}
function navigate(n){page=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function compressImage(file,max=800){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const ratio=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not open image'))};img.src=url})}
async function extractText(file){const ext=file.name.split('.').pop().toLowerCase();if(['txt','md','csv','json','ics','rtf'].includes(ext))return await file.text();if(ext==='docx'){const mammoth=await import('https://esm.sh/mammoth@1.9.0');const x=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return x.value||''}if(ext==='pdf'){const pdfjs=await import('https://esm.sh/pdfjs-dist@4.10.38/legacy/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();out+=c.items.map(x=>x.str||'').join(' ')+'\n'}return out}if(['xlsx','xls'].includes(ext)){const XLSX=await import('https://esm.sh/xlsx@0.18.5');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return wb.SheetNames.map(n=>'SHEET: '+n+'\\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\\n')}return ''}
function putIDB(file){return new Promise((resolve,reject)=>{const req=indexedDB.open('rose-assistent-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result,tx=db.transaction('files','readwrite');tx.objectStore('files').put(file, file.__roseId);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>reject(tx.error)}})}
function getIDB(id){return new Promise((resolve,reject)=>{const r=indexedDB.open('rose-assistent-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{const db=r.result,tx=db.transaction('files','readonly'),q=tx.objectStore('files').get(id);q.onsuccess=()=>{resolve(q.result);db.close()};q.onerror=()=>reject(q.error)};r.onerror=()=>reject(r.error)})}
async function processFiles(files){for(const f of files){const did=id();let txt='';try{txt=(await extractText(f)).slice(0,90000)}catch(e){toast('Could not extract text from '+f.name+'; the document will still be saved.')}try{const tagged=new File([f],f.name,{type:f.type});Object.defineProperty(tagged,'__roseId',{value:did});await putIDB(tagged)}catch{}data.docs.unshift({id:did,name:f.name,type:f.type,size:f.size,course:'Unsorted',text:txt,added:new Date().toISOString(),localFile:true});if(f.name.toLowerCase().endsWith('.ics'))parseICS(txt)}saveData();render();toast(files.length+' document'+(files.length===1?'':'s')+' added to your study library.')}
function parseICS(raw){const chunks=raw.split('BEGIN:VEVENT').slice(1);for(const c of chunks){const title=(c.match(/SUMMARY[^:]*:(.+)/)||[])[1]||'Imported calendar event',date=(c.match(/DTSTART(?:;[^:]*)?:(\d{8}T\d{6}Z?|\d{8})/)||[])[1];if(!date)continue;const start=date.length===8?date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+'T09:00':date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+'T'+date.slice(9,11)+':'+date.slice(11,13);data.events.push({id:id(),title:title.replace(/\\n/g,' '),start,kind:'Imported',alert:15})}}
function makeTasks(doc){const text=doc.text||'';const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.length>4&&x.length<160);let candidates=lines.filter(x=>/week\s*\d+|chapter\s*\d+|reading|assignment|topic\s*\d+|lecture\s*\d+|tutorial|revision|due|assessment/i.test(x)).slice(0,16);if(!candidates.length)candidates=lines.slice(0,5);if(!candidates.length){toast('This file had no extracted text to turn into tasks.');return}for(const line of candidates){data.tasks.push({id:id(),title:line.replace(/^[-*\d.\s]+/,''),course:doc.name.slice(0,40),due:today(),priority:2,minutes:25,done:false,docId:doc.id})}saveData();toast(candidates.length+' study tasks created from '+doc.name);navigate('Planner')}
function exportICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rose A Assistent//EN'];for(const e of data.events||[]){const dt=new Date(e.start||e.date);if(isNaN(dt))continue;const utc=dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');lines.push('BEGIN:VEVENT','UID:'+e.id+'@rose-assistent','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+utc,'SUMMARY:'+String(e.title||'Event').replace(/[,;]/g,' '),'DESCRIPTION:'+String(e.kind||'').replace(/[,;]/g,' '),'END:VEVENT')}lines.push('END:VCALENDAR');download('rose-calendar.ics',new Blob([lines.join('\r\n')],{type:'text/calendar'}))}
function exportData(){download('rose-assistent-backup.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}))}
function notify(title,body){if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body,icon:'/rose-mark.svg'});clockSound()}
async function alerts(){if(!data.settings.reminders)return;const now=Date.now();for(const ev of data.events||[]){if(ev.notified)continue;const start=new Date(ev.start||ev.date).getTime();const at=start-(Number(ev.alert)||0)*60000;if(start>now-60000&&at<=now&&at>now-65000){ev.notified=true;saveData();notify('Coming up: '+ev.title,(ev.kind||'Reminder')+' · '+fmtTime(ev.start));toast('Reminder: '+ev.title)}}for(const n of data.notes||[]){if(n.seen||!n.at||new Date(n.at).getTime()>now)continue;if(!n.notified){n.notified=true;saveData();notify('A little note for you 💌',n.title||'A message is ready');toast('A new little note is waiting in Rose Mail.')} }}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;if(b.classList.contains('modalshade')&&ev.target.closest('.modal'))return;const a=b.dataset.act,idv=b.dataset.id;try{
if(a==='nav')navigate(b.dataset.page);
if(a==='add-task-modal')taskModal();
if(a==='add-note-modal')noteModal();
if(a==='voice-listen')startSpeechCapture('chat');
if(a==='voice-stop'||a==='dictation-stop'){voiceShouldSend=false;if(voiceRecognition)voiceRecognition.stop();else toast('No active listening session.');}
if(a==='voice-speech-toggle'){voiceSpeakReplies=!voiceSpeakReplies;render();toast('Spoken replies '+(voiceSpeakReplies?'enabled.':'disabled.'));}
if(a==='voice-clear'){data.voiceMessages=[];saveData();render();toast('Conversation cleared.');}
if(a==='dictation-start')startSpeechCapture('note');
if(a==='dictation-save'){const transcript=document.getElementById('voice-transcript')?.value.trim();if(!transcript){toast('Dictate or type a note first.');return;}data.docs.unshift({id:id(),name:'Voice note — '+fmtDate(today()),type:'text/plain',size:transcript.length,course:'Voice notes',text:transcript,added:new Date().toISOString()});saveData();render();toast('Transcript saved to your Study Library.');}
if(a==='dictation-mail'){const transcript=document.getElementById('voice-transcript')?.value.trim();if(!transcript){toast('Dictate or type a note first.');return;}data.notes.unshift({id:id(),title:'A dictated note',body:transcript,from:data.profile.name||'Rose',at:new Date().toISOString(),photo:'',seen:false});saveData();render();toast('Transcript saved to Rose Mail.');}
if(a==='dictation-speak'){const transcript=document.getElementById('voice-transcript')?.value.trim();if(transcript)speakVoiceReply(transcript);else toast('There is no transcript to read yet.');}
if(a==='start-recording')startVoiceRecording();
if(a==='stop-recording')stopVoiceRecording();
if(a==='close-modal'){document.getElementById('modalroot').innerHTML=''}
if(a==='toggle-task'){const t=data.tasks.find(x=>x.id===idv);if(t){t.done=b.checked;if(t.done){data.garden.xp=(data.garden.xp||0)+1;toast('Little win collected. Well done, Rose. 🌷')}saveData();render()}}
if(a==='delete-event'){data.events=data.events.filter(x=>x.id!==idv);saveData();render();toast('Event removed.')}
if(a==='auto-plan'){const pend=dueTasks();if(pend.length){pend.sort((x,y)=>score(y)-score(x));const old=pendingOrder();pend.forEach((t,i)=>{if(i<3)t.due=today();});saveData();render();toast('Your plan has been rebalanced around the highest-priority tasks.')}else toast('All caught up. Enjoy the breathing room.')}
if(a==='start-suggested'){timerSeconds=Math.min(45,Number(dueTasks()[0]?.minutes)||25)*60;timerMode='Focus';navigate('Focus timer');startTimer();}
if(a==='jump-add-event'){document.getElementById('event-form')?.scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#event-form input[name=title]')?.focus()}
if(a==='export-ics')exportICS();
if(a==='notifications'){if(!('Notification'in window)){toast('This browser does not support web notifications.');return}const p=await Notification.requestPermission();toast(p==='granted'?'Browser reminders are enabled.':'Notifications were not enabled.')}
if(a==='doc-tasks'){const d=data.docs.find(x=>x.id===idv);if(d)makeTasks(d)}
if(a==='doc-read'){const d=data.docs.find(x=>x.id===idv);if(d)modal(esc(d.name),'<p class="muted small">Extracted document text</p><div style="white-space:pre-wrap;max-height:55vh;overflow:auto;font-size:13px">'+esc(d.text||'No readable text was extracted.')+'</div><div class="btnrow" style="margin-top:15px"><button class="primary" data-act="doc-tasks" data-id="'+d.id+'">Create study tasks</button><button class="ghost" data-act="doc-download" data-id="'+d.id+'">Download original</button></div>')}
if(a==='doc-download'){const f=await getIDB(idv);if(f)download(f.name,f);else toast('Original file is only available in the browser where it was uploaded.')}
if(a==='doc-delete'){data.docs=data.docs.filter(x=>x.id!==idv);saveData();render();toast('Document removed from the library.')}
if(a==='timer-toggle'){if(timerRun)stopTimer();else startTimer();render()}
if(a==='timer-reset'){stopTimer();timerSeconds=timerMode==='Long focus'?3000:timerMode==='Short break'?300:1500;render()}
if(a==='timer-break'){stopTimer();timerMode='Short break';timerSeconds=300;render()}
if(a==='timer-mode'){stopTimer();timerMode=b.dataset.mode;timerSeconds=timerMode==='Long focus'?3000:timerMode==='Short break'?300:1500;render()}
if(a==='log-session'){const task=document.getElementById('focus-task')?.value,t=data.tasks.find(x=>x.id===task);data.studySessions.unshift({id:id(),day:today(),minutes:timerMode==='Long focus'?50:timerMode==='Short break'?5:25,title:t?.title||'Personal focus',note:document.getElementById('focus-note')?.value||''});if(t&&timerMode!=='Short break'){t.minutes=Math.max(5,(Number(t.minutes)||25)-25)}saveData();render();toast('Study session saved. Every minute counts.')}
if(a==='note-read'){const n=data.notes.find(x=>x.id===idv);if(n){if(n.at&&new Date(n.at)>new Date()){toast('This little letter opens on '+fmtDate(n.at)+' at '+fmtTime(n.at)+'.');return}n.seen=true;saveData();modal(esc(n.title||'A note for Rose'),'<div class="note"><div class="heart">💗</div><div class="from">'+esc(n.from||'A note for you')+'</div><p style="white-space:pre-wrap">'+esc(n.body)+'</p>'+(n.photo?'<img src="'+n.photo+'" style="width:100%;max-height:250px;object-fit:cover;border-radius:12px">':'')+(n.audio?'<audio controls style="width:100%;margin:10px 0" src="'+n.audio+'"></audio>':'')+'</div>');}}
if(a==='note-delete'){data.notes=data.notes.filter(n=>n.id!==idv);saveData();render()}
if(a==='water'){if(data.garden.day!==today()){data.garden.day=today();data.garden.water=0}data.garden.water=(data.garden.water||0)+1;data.garden.xp=(data.garden.xp||0)+1;saveData();render();toast('A little water for a little growth. 💧')}
if(a==='grow'){if((data.garden.xp||0)<2){toast('Finish a small task or water your garden to earn points for a new bloom.');return}data.garden.xp-=2;data.garden.blooms=(data.garden.blooms||0)+1;saveData();render();toast('A new flower is blooming. 🌷')}
if(a==='new-game'){newGame()}
if(a==='petal'){const i=Number(b.dataset.index);if(gameState.found.includes(i)||gameState.opened.includes(i))return;gameState.opened.push(i);const p=document.getElementById('petals');if(p)p.innerHTML=gameBoard();if(gameState.opened.length===2){const [x,y]=gameState.opened;if(gameState.values[x]===gameState.values[y]){gameState.found.push(x,y);gameState.opened=[];if(gameState.found.length===gameState.values.length){data.garden.xp=(data.garden.xp||0)+3;saveData();const gm=document.getElementById('game-message');if(gm)gm.textContent='You found every pair! Three garden points earned. 🌸'} }else setTimeout(()=>{gameState.opened=[];const p2=document.getElementById('petals');if(p2)p2.innerHTML=gameBoard()},800);const p2=document.getElementById('petals');if(p2)p2.innerHTML=gameBoard();}}
if(a==='care-mood'){if(!data.care)data.care={mood:'Okay',checks:[],thought:'',breaths:0};data.care.mood=b.dataset.mood;data.feedback.push({id:id(),kind:'care-check-in',mood:b.dataset.mood,at:new Date().toISOString()});saveData();render();toast('Thank you for checking in with yourself. ♡')}
if(a==='care-check'){if(!data.care)data.care={mood:'Okay',checks:[],thought:'',breaths:0};const v=b.dataset.id;data.care.checks=(data.care.checks||[]).includes(v)?data.care.checks.filter(x=>x!==v):[...(data.care.checks||[]),v];saveData();render()}
if(a==='care-breathe'){if(!data.care)data.care={mood:'Okay',checks:[],thought:'',breaths:0};data.care.breaths=(data.care.breaths||0)+1;saveData();modal('A little breathing space','<div class="garden"><div><div style="font-size:48px">🌿</div><h3>Breathe in slowly for 4 counts.</h3><p class="muted">Hold gently for 4, then breathe out for 6. Repeat a few times, only as comfortable for you.</p><p class="quote">There is nothing you need to prove in this moment.</p></div></div><div class="btnrow" style="justify-content:flex-end;margin-top:15px"><button class="primary" data-act="close-modal">I feel a little steadier</button></div>')}
if(a==='clear-wallpaper'){data.profile.wallpaper='';saveData();render();toast('Wallpaper removed.')}
if(a==='sound-toggle'){data.settings.sound=!data.settings.sound;saveData();render()}
if(a==='sync-now'){await syncCloud();render();toast('Cloud sync checked.')}
if(a==='signout'){await supabase.auth.signOut();session=null;render();toast('Signed out. Your local planner is still saved.')}
if(a==='export-data')exportData();
if(a==='reset-data'){modal('Reset your planner?','<p>This removes local planner data from this browser. Cloud data in your account will remain unless overwritten later.</p><div class="btnrow"><button class="ghost" data-act="close-modal">Keep my data</button><button class="primary" data-act="confirm-reset">Reset this browser</button></div>')}
if(a==='confirm-reset'){localStorage.removeItem(KEY);data=defaults();saveData(false);document.getElementById('modalroot').innerHTML='';render();toast('A fresh little start.')}
}catch(e){console.error(e);toast('That action did not complete. Please try again.')}}
);
function pendingOrder(){return dueTasks().map(t=>t.id)}
function startTimer(){if(timerRun)return;timerRun=setInterval(()=>{if(timerSeconds>0){timerSeconds--;const f=document.getElementById('timerface');if(f)f.textContent=clock(timerSeconds);document.title=clock(timerSeconds)+' · Rose A. Assistent'}else{stopTimer();clockSound();notify('A little pause, Rose 🌷','Your focus session is finished. Stand up, stretch and be kind to yourself.');if(timerMode!=='Short break'){data.studySessions.unshift({id:id(),day:today(),minutes:timerMode==='Long focus'?50:25,title:'Completed '+timerMode.toLowerCase(),note:'Timer completed'});data.garden.xp=(data.garden.xp||0)+1;saveData()}toast('Lovely work. You showed up for yourself.');render()}},1000);const btn=document.getElementById('timer-toggle');if(btn)btn.textContent='Pause'}
function stopTimer(){if(timerRun)clearInterval(timerRun);timerRun=null;const btn=document.getElementById('timer-toggle');if(btn)btn.textContent='Start focus';document.title='Rose A. Assistent — your space to bloom'}
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='doc-upload'){if(el.files?.length)await processFiles([...el.files]);el.value=''}if(el.id==='ics-upload'){const f=el.files?.[0];if(f){parseICS(await f.text());saveData();render();toast('Calendar events imported.')}el.value=''}if(el.id==='avatar-upload'||el.id==='wallpaper-upload'){const f=el.files?.[0];if(f){const img=await compressImage(f,el.id==='avatar-upload'?500:1400);data.profile[el.id==='avatar-upload'?'avatar':'wallpaper']=img;saveData();render();toast('Your personal image is saved.')}}if(el.id==='doc-search'){const q=el.value.toLowerCase();const found=(data.docs||[]).filter(d=>(d.name+' '+d.text).toLowerCase().includes(q));const box=document.getElementById('doc-list');if(box)box.innerHTML=docRows(found)}});
document.addEventListener('submit',async ev=>{const form=ev.target;ev.preventDefault();const f=new FormData(form);
if(form.id==='voice-chat-form'){const text=String(f.get('message')||'').trim();if(text)sendVoiceMessage(text);return;}
if(form.id==='task-form'){const title=String(f.get('title')||'').trim();if(!title)return;data.tasks.push({id:id(),title,course:String(f.get('course')||'Personal'),due:String(f.get('due')||today()),priority:Number(f.get('priority')||2),minutes:Number(f.get('minutes')||25),details:String(f.get('details')||''),done:false});saveData();document.getElementById('modalroot').innerHTML='';render();toast('Added to your little plan. 🌷');return}
if(form.id==='event-form'){data.events.push({id:id(),title:String(f.get('title')),kind:String(f.get('kind')),start:String(f.get('start')),location:String(f.get('location')),alert:Number(f.get('alert')||0),repeat:String(f.get('repeat')||'none')});saveData();render();toast('Your calendar has been updated.');return}
if(form.id==='profile-form'){data.profile.name=String(f.get('name')||'Rose');data.profile.subtitle=String(f.get('subtitle')||'');data.profile.targetHours=Number(f.get('targetHours')||3);data.profile.theme=String(f.get('theme')||'#c85189');saveData();render();toast('Your space has been updated.');return}
if(form.id==='note-form'){let photo='';const file=document.getElementById('note-photo')?.files?.[0];if(file)photo=await compressImage(file,1000);data.notes.push({id:id(),title:String(f.get('title')||'A note for Rose'),body:String(f.get('body')||''),from:String(f.get('from')||'Your favourite person'),at:new Date(String(f.get('at')||new Date().toISOString())).toISOString(),photo,audio:recordedAudio,seen:false});recordedAudio='';saveData();document.getElementById('modalroot').innerHTML='';render();toast('Your little letter has been saved. 💌');return}
if(form.id==='care-note-form'){if(!data.care)data.care={mood:'Okay',checks:[],thought:'',breaths:0};data.care.thought=String(f.get('thought')||'');saveData();render();toast('Your reflection is saved. Be gentle with yourself.');return}
if(form.id==='auth-form'){const email=String(f.get('email')),password=String(f.get('password')),mode=ev.submitter?.value||'signin';const out=mode==='signup'?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});const m=document.getElementById('auth-msg');if(out.error){if(m)m.textContent=out.error.message;return}if(m)m.textContent=mode==='signup'?'Account created. Check your email if confirmation is enabled, then sign in.':'Signing you in…';if(out.data.session){session=out.data.session;await loadCloud();render();toast('Welcome back to your space, Rose. ♡')}else render();return}
});
async function loadCloud(){if(!session)return;setSync('Loading your private workspace…');try{const {data:row,error}=await supabase.from('rose_workspaces').select('data,updated_at').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(row&&row.data&&typeof row.data==='object'){const local=loadData();data={...defaults(),...row.data};if(local.tasks?.length&&!data.tasks?.length)data.tasks=local.tasks;localStorage.setItem(KEY,JSON.stringify(data));setSync('Your private workspace is up to date')}else{await syncCloud();setSync('Private workspace created')}}catch(e){console.error(e);setSync('Cloud sync needs attention');toast('Signed in, but cloud sync could not load. Check the database permissions.')}}
supabase.auth.getSession().then(async({data:s})=>{session=s.session;if(session)await loadCloud();render()});
supabase.auth.onAuthStateChange(async(_event,s)=>{session=s;if(session){await loadCloud()}render()});
setInterval(()=>alerts(),15000);
setInterval(()=>{if(!session)return;if(Date.now()-lastSave>30000)syncCloud()},30000);
render();
</script></body></html>
