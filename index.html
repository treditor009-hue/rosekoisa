/* Rose A. motion design layer */
:root{--bg:#fff8fb;--surface:#fffdfd;--ink:#4e3042;--muted:#927487;--pink:#c85189;--pale:#ffedf4;--line:#f0d8e4;--shadow:0 14px 38px rgba(126,53,88,.075)}
body{background:radial-gradient(ellipse at 4% 9%,rgba(255,220,235,.56),transparent 26%),radial-gradient(ellipse at 96% 36%,rgba(255,235,211,.5),transparent 24%),var(--bg);background-attachment:fixed}

main{position:relative}
.topbar{padding-bottom:17px;border-bottom:1px solid rgba(239,215,228,.72)}
.hero{box-shadow:0 18px 46px rgba(126,53,88,.09);border:1px solid rgba(255,255,255,.74);isolation:isolate}
.hero:after{opacity:.55;animation:slowDrift 12s ease-in-out infinite alternate}
.hero h2{text-wrap:balance}
.hero .tag{box-shadow:0 4px 15px rgba(112,48,78,.05)}
.hero .primary,.hero .ghost,.voice-shortcut,.soft,button.primary,button.ghost{transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
button.primary:hover,.hero .primary:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(200,81,137,.23)}
button.ghost:hover,.soft:hover,.voice-shortcut:hover{transform:translateY(-2px)}
.sectionhead{align-items:center}
.dashboard-sectionhead{margin-top:23px;margin-bottom:14px;align-items:flex-end}

.section-kicker{font-size:9px;letter-spacing:1.9px;font-weight:850;color:#b05d83}
.syncpill{border:1px solid #f1dce7;background:rgba(255,255,255,.8);padding:8px 11px;border-radius:99px;white-space:nowrap}
.stat,.card{position:relative;border-color:rgba(239,215,228,.9);box-shadow:0 10px 30px rgba(126,53,88,.045);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s ease;background:rgba(255,255,255,.91)}
.stat{isolation:isolate;overflow:hidden;padding:20px 19px 18px}
.stat:before{content:"";position:absolute;z-index:-1;right:-35px;top:-48px;width:112px;height:112px;border-radius:50%;background:var(--stat-glow,#fff0f7);opacity:.9;transition:transform .5s var(--ease)}
.stat:nth-child(1){--stat-glow:#ffe7f1;--stat-accent:#b64f80}
.stat:nth-child(2){--stat-glow:#fff0df;--stat-accent:#b77e43}
.stat:nth-child(3){--stat-glow:#e8f4ef;--stat-accent:#598873}
.stat:nth-child(4){--stat-glow:#f0eafd;--stat-accent:#8270b1}
.stat:hover,.card:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(126,53,88,.09);border-color:#e9bfd3}

.stat .statlabel{font-size:11px;letter-spacing:.15px;position:relative}
.stat .big{position:relative;font-size:clamp(25px,2.5vw,31px);color:var(--stat-accent,var(--ink));font-variant-numeric:tabular-nums;line-height:1.25;margin:11px 0 5px}
.stat .statfoot{position:relative;font-size:10px}

.quick-actions{margin:16px 0 4px;padding:15px 16px;border:1px solid rgba(239,215,228,.9);border-radius:20px;background:linear-gradient(110deg,rgba(255,255,255,.92),rgba(255,246,250,.95) 52%,rgba(255,249,239,.95));box-shadow:0 10px 27px rgba(126,53,88,.045);display:grid;grid-template-columns:minmax(150px,.7fr) minmax(0,2fr);gap:14px;align-items:center}

.quick-action-intro strong{font-size:13px;letter-spacing:-.25px}

.quick-action .qa-icon{width:32px;height:32px;flex:0 0 32px;border-radius:11px;background:linear-gradient(145deg,#ffedf5,#fff3e5);display:grid;place-items:center;color:#af4f7d;font-size:17px}
.quick-action strong,.quick-action small{display:block;min-width:0}
.quick-action strong{font-size:10px;line-height:1.25}
.quick-action small{font-size:9px;color:var(--muted);margin-top:3px}
.quick-action .qa-arrow{margin-left:auto;color:#b77b99;font-size:13px}
.lordicon-wrap{position:relative;width:var(--icon-size,34px);height:var(--icon-size,34px);display:inline-grid;place-items:center;flex:0 0 auto;overflow:visible}
.lordicon-wrap .icon-fallback{position:relative;z-index:1;display:grid;place-items:center;transition:opacity .2s ease,transform .2s ease;font-size:.95em}
.lordicon-wrap lord-icon{position:absolute!important;inset:0;z-index:2;display:block;width:var(--icon-size,34px);height:var(--icon-size,34px);opacity:0;transition:opacity .2s ease}
.lordicon-wrap.lordicon-ready .icon-fallback{opacity:0;transform:scale(.7)}
.lordicon-wrap.lordicon-ready lord-icon{opacity:1}
.staticon .lordicon-wrap{--icon-size:34px}
.nav .lordicon-wrap{--icon-size:27px}
.empty-animation{display:flex;align-items:center;justify-content:center;min-height:58px;margin-bottom:5px}
.empty-animation .lordicon-wrap{--icon-size:55px}
.empty .bigflower{display:inline-grid;place-items:center;animation:gentleBob 4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(180,76,122,.11))}
.note,.event,.docrow,.petal{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.event:hover{transform:translateY(-2px);box-shadow:0 8px 19px rgba(126,53,88,.06);border-color:#eac2d5}
.note:hover{transform:translateY(-3px) rotate(-.15deg)}
.footer,.footnote{opacity:.83}
@keyframes brandBreathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-3deg)}}
@keyframes gentleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes slowDrift{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-10px) rotate(3deg)}}

@media(max-width:1050px){.quick-actions{grid-template-columns:1fr}.quick-action-buttons{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media(prefers-reduced-motion:reduce){.brandmark,.hero:after,.stat-glyph,.progress span,.quick-spark,.empty .bigflower{animation:none!important}.stat,.card,.listrow,.event,.note,.quick-action,.nav button,.hero .primary,button.primary,button.ghost,.soft{transition:none!important}.stat:hover,.card:hover,.event:hover,.note:hover,.quick-action:hover,.nav button:hover{transform:none}}

.jarvis-console{position:relative;overflow:hidden;border:1px solid rgba(227,158,195,.42);border-radius:22px;padding:17px;background:radial-gradient(circle at 50% 22%,rgba(100,68,140,.12),transparent 45%),linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,244,250,.94));box-shadow:0 16px 42px rgba(99,49,91,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
body[data-style="midnight"] .jarvis-console{background:radial-gradient(circle at 50% 22%,rgba(78,129,208,.17),transparent 48%),linear-gradient(145deg,rgba(42,31,54,.96),rgba(29,26,43,.96));border-color:rgba(113,154,223,.32)}
.jarvis-console:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 18%,rgba(255,255,255,.28) 48%,transparent 72%);opacity:.5}
.jarvis-header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.jarvis-brand{font-size:10px;letter-spacing:2.1px;font-weight:900;color:#a84f83}.jarvis-subbrand{font-size:10px;color:var(--muted);margin-top:4px}
.jarvis-toggle{border:1px solid #e6b7d0;border-radius:99px;padding:9px 13px;background:linear-gradient(135deg,#fff2f8,#f8e7f7);color:#953a72;font-size:11px;font-weight:850;cursor:pointer;box-shadow:0 5px 16px rgba(180,76,122,.09);transition:transform .2s ease,box-shadow .2s ease}
.jarvis-toggle.enabled{background:linear-gradient(135deg,#e0f8f6,#e7e9ff);color:#245f75;border-color:#add9e0}
.jarvis-toggle:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(100,73,130,.12)}
.jarvis-settings{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:15px;position:relative}
.jarvis-settings label{grid-column:1/-1;font-size:10px;letter-spacing:.6px;color:var(--muted);font-weight:800}
.jarvis-settings input{width:100%;min-width:0;border:1px solid #eed2e2;border-radius:12px;background:rgba(255,255,255,.78);color:#4e3042;padding:10px 12px;font:inherit;font-size:12px}

.jarvis-status{position:relative;margin:12px 0 0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;line-height:1.5}
.jarvis-status-dot{width:7px;height:7px;border-radius:50%;background:#bba9b8;box-shadow:0 0 0 4px rgba(187,169,184,.12);flex:0 0 7px}
.jarvis-status-dot.on{background:#44b8a5;box-shadow:0 0 0 4px rgba(68,184,165,.15);animation:jarvisStatusPulse 2s infinite}

.jarvis-orb-label{font-size:9px;letter-spacing:2px;font-weight:900;text-align:center;color:#a25b91;margin-top:-4px}
body[data-style="midnight"] .jarvis-orb-label{color:#9bc4ff}
.jarvis-disclaimer{font-size:10px;line-height:1.55;color:var(--muted);margin-top:12px}
@keyframes jarvisAura{0%,100%{transform:scale(.95);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes jarvisStatusPulse{0%,100%{opacity:1}50%{opacity:.48}}
@media(max-width:780px){.jarvis-console{padding:14px}.jarvis-header{align-items:flex-start}.jarvis-toggle{padding:8px 11px}.jarvis-orb-stage{width:min(100%,270px)}}

async function processFiles(files){for(const f of files){const did=id();let txt='';try{txt=(await extractText(f)).slice(0,90000)}catch(e){toast('Could not extract text from '+f.name+'; the document will still be saved.')}try{const tagged=new File([f],f.name,{type:f.type});Object.defineProperty(tagged,'__roseId',{value:did});await putIDB(tagged)}catch{}data.docs.unshift({id:did,name:f.name,type:f.type,size:f.size,course:'Unsorted',text:txt,added:new Date().toISOString(),localFile:true});if(f.name.toLowerCase().endsWith('.ics'))parseICS(txt)}saveData();render();toast(files.length+' document'+(files.length===1?'':'s')+' added to your study library.')}
function parseICS(raw){const chunks=raw.split('BEGIN:VEVENT').slice(1);for(const c of chunks){const title=(c.match(/SUMMARY[^:]*:(.+)/)||[])[1]||'Imported calendar event',date=(c.match(/DTSTART(?:;[^:]*)?:(\d{8}T\d{6}Z?|\d{8})/)||[])[1];if(!date)continue;const start=date.length===8?date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+'T09:00':date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+'T'+date.slice(9,11)+':'+date.slice(11,13);data.events.push({id:id(),title:title.replace(/\\n/g,' '),start,kind:'Imported',alert:15})}}
function makeTasks(doc){const text=doc.text||'';const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.length>4&&x.length<160);let candidates=lines.filter(x=>/week\s*\d+|chapter\s*\d+|reading|assignment|topic\s*\d+|lecture\s*\d+|tutorial|revision|due|assessment/i.test(x)).slice(0,16);if(!candidates.length)candidates=lines.slice(0,5);if(!candidates.length){toast('This file had no extracted text to turn into tasks.');return}for(const line of candidates){data.tasks.push({id:id(),title:line.replace(/^[-*\d.\s]+/,''),course:doc.name.slice(0,40),due:today(),priority:2,minutes:25,done:false,docId:doc.id})}saveData();toast(candidates.length+' study tasks created from '+doc.name);navigate('Planner')}
function exportICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rose A Assistent//EN'];for(const e of data.events||[]){const dt=new Date(e.start||e.date);if(isNaN(dt))continue;const utc=dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');lines.push('BEGIN:VEVENT','UID:'+e.id+'@rose-assistent','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+utc,'SUMMARY:'+String(e.title||'Event').replace(/[,;]/g,' '),'DESCRIPTION:'+String(e.kind||'').replace(/[,;]/g,' '),'END:VEVENT')}lines.push('END:VCALENDAR');download('rose-calendar.ics',new Blob([lines.join('\r\n')],{type:'text/calendar'}))}

});
function initPWA(){if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferredInstallPrompt=ev});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('Rose has been added to your device. 🌷')})}
function initSupabase(){render();import('https://esm.sh/@supabase/supabase-js@2.57.0').then(async({createClient})=>{supabase=createClient(SB_URL,SB_KEY);const {data:s}=await supabase.auth.getSession();session=s.session;if(session)await loadCloud();supabase.auth.onAuthStateChange(async(_event,s)=>{session=s;if(session)await loadCloud();render()});render()}).catch(()=>{supabase=null;const sync=document.getElementById('sync-text');if(sync)sync.textContent='Saved on this device · offline-friendly mode'})}
async function loadCloud(){if(!supabase||!session)return;setSync('Loading your private workspace…');try{const {data:row,error}=await supabase.from('rose_workspaces').select('data,updated_at').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(row&&row.data&&typeof row.data==='object'){const local=loadData();data={...defaults(),...row.data};if(local.tasks?.length&&!data.tasks?.length)data.tasks=local.tasks;localStorage.setItem(KEY,JSON.stringify(data));setSync('Your private workspace is up to date')}else{await syncCloud();setSync('Private workspace created')}}catch(e){console.error(e);setSync('Cloud sync needs attention');toast('Signed in, but cloud sync could not load. Check the database permissions.')}}
/* Supabase now initialises asynchronously so local mode can render first. */
setInterval(()=>alerts(),15000);
setInterval(()=>{if(!session)return;if(Date.now()-lastSave>30000)syncCloud()},30000);
initPWA();
initSupabase();
</script></body></html>
